# Offline manual deploy: Postgres + the Next.js app, no CI/CD and no
# nginx/certbot — this server has no international internet access (so it
# can't reach Docker Hub/GHCR to pull, or Let's Encrypt to issue a cert
# itself), and port 80/443 already belong to another site on the same box.
# TLS and the public domain are handled by that existing reverse proxy;
# `app` only listens on 127.0.0.1, one internal port, for it to proxy to.
#
# Images are built on GitHub Actions (.github/workflows/build.yml — build
# only, no deploy, no registry push) and downloaded as a workflow artifact
# (see docs/DEPLOYMENT.md); `build:` below is kept only as a manual
# fallback if you'd rather build locally on a machine with international
# internet access. Either way, the result is `docker save`d, copied to this
# server, and loaded with `docker load` — nothing here ever gets built or
# pulled from the internet on the server itself except by hand, once.
#
# Deploy sequence on the server, after `docker load -i rahyad-images.tar.gz`:
#   docker compose up -d db
#   docker compose run --rm migrate
#   docker compose up -d app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [rahyad_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: `docker compose run --rm migrate`. Not part of `up`.
  migrate:
    image: rahyad-migrate:latest
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [rahyad_net]
    profiles: ["tools"]

  app:
    image: rahyad-app:latest
    build:
      context: .
      target: runner
      network: rahyad_net
      # next build runs generateStaticParams / page data fetching against a
      # real database, so it needs a migrated Postgres reachable at build
      # time — hence `network: rahyad_net` above and `db` as the host here.
      # This only matters on the machine you *build* on (see
      # docs/DEPLOYMENT.md) — the production server just loads the result.
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: unless-stopped
    ports:
      # Bound to localhost only — the existing reverse proxy on this server
      # (the one already serving another site on 80/443) proxies the
      # domain here. Not exposed directly to the internet.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
    volumes:
      - uploads:/app/apps/web/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [rahyad_net]

networks:
  rahyad_net:

volumes:
  pgdata:
  uploads:
