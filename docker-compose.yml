# Production stack for a single Linux server: Postgres + the Next.js app +
# nginx (TLS termination, reverse proxy) + certbot (Let's Encrypt renewal).
#
# `app` and `migrate` are built in GitHub Actions and pushed to GHCR (see
# .github/workflows/deploy.yml) — the `build:` blocks below are kept only as
# a manual fallback (`docker compose build app`) for building on the server
# itself when you're debugging and don't want to wait on CI.
#
# Prereqs on the server (see docs/DEPLOYMENT.md):
#   docker network create rahyad_net
#   ./scripts/init-letsencrypt.sh   (once, before the first `nginx` start)
#
# Typical deploy sequence (also what .github/workflows/deploy.yml's `deploy`
# job runs, after the `build` job has pushed fresh images to GHCR):
#   docker compose up -d db
#   docker compose pull migrate app
#   docker compose run --rm migrate
#   docker compose up -d app nginx certbot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [rahyad_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: `docker compose run --rm migrate`. Not part of `up`.
  migrate:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}/migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [rahyad_net]
    profiles: ["tools"]

  app:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}/app:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runner
      network: rahyad_net
      # next build runs generateStaticParams / page data fetching against a
      # real database, so it needs a migrated Postgres reachable at build
      # time — hence `network: rahyad_net` above and `db` as the host here.
      # (CI builds against a throwaway, freshly-migrated Postgres instead —
      # see the `build` job in .github/workflows/deploy.yml.)
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
    volumes:
      - uploads:/app/apps/web/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [rahyad_net]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks: [rahyad_net]
    # Reload periodically so renewed certs (written by the certbot service)
    # get picked up without restarting the container.
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks: [rahyad_net]
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot -q; sleep 12h & wait $${!}; done'

networks:
  rahyad_net:
    external: true

volumes:
  pgdata:
  uploads:
