server {
    listen 80;
    listen [::]:80;
    server_name rahyad.com www.rahyad.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rahyad.com www.rahyad.com;

    ssl_certificate /etc/letsencrypt/live/rahyad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rahyad.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Admin panel handles image/video uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Next.js App Router streaming needs proxy buffering disabled, see
        # node_modules/next/dist/docs/01-app/02-guides/self-hosting.md.
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
    }
}
